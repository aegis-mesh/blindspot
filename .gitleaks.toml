# gitleaks reads this file from the repository root. It keeps every default rule and
# allows one thing: Blindspot's own pattern for Amazon Bedrock short-term keys, which holds the
# fixed start every such key has, followed by the regex for the rest, so Blindspot can find those
# keys. It sits in data/keys.tsv and, written there by tools/gen.sh, in gird-check.sh,
# gird-check.ps1 and gird-fleet.sh. A real key is followed by key characters, not by this
# regex, and a real key on any other line is still reported.
[extend]
useDefault = true

[[allowlists]]
description = "Blindspot's own Bedrock key pattern, not a key"
regexTarget = "line"
regexes = ['''bedrock-api-key-YmVkcm9jay5hbWF6b25hd3MuY29t\[A-Za-z0-9\+/=\]\{144\}''']
