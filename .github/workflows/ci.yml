name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s bash -S warning gird-check.sh gird-fleet.sh tools/review-guard.sh tools/review-guard-decide.sh tools/release.sh tests/*.sh

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The suite runs about 23 minutes on an M-series Mac, and took 42 on GitHub's macOS runner for 1.3.0:
    # the limits leave room for slower runners.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/run.sh

  powershell:
    name: tests (pwsh, ubuntu-latest)
    runs-on: ubuntu-latest
    # Both suites: for 1.3.0, tests/run.sh took 17 minutes on GitHub's runner and tests/run-ps.sh more
    # than the 73 left of 90 (it starts PowerShell for each of its cases), over an hour on an M-series Mac.
    timeout-minutes: 180
    # With ripgrep installed, both suites test the ripgrep session engine too; the variable makes a
    # missing ripgrep fail those tests instead of skipping them.
    env:
      GIRD_CHECK_TEST_REQUIRE_RG: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep && rg --version
      # The runner image installs Microsoft Graph's modules for every user, and PowerShell 7 looks in its
      # own module folders before PSModulePath, so tests/intune.sh would load them in place of its
      # stand-in and sign in for real. Only the stand-in may be seen: remove each Microsoft.Graph module
      # folder the runner has, then fail if PowerShell still lists one.
      - run: |
          pwsh -NoProfile -Command 'Get-Module -ListAvailable -Name Microsoft.Graph* | ForEach-Object { Split-Path $_.ModuleBase } | Sort-Object -Unique' > "$RUNNER_TEMP/graph-dirs"
          while IFS= read -r d; do case "${d##*/}" in Microsoft.Graph*) echo "removing $d"; sudo rm -rf -- "$d" ;; esac; done < "$RUNNER_TEMP/graph-dirs"
          pwsh -NoProfile -Command 'if (Get-Module -ListAvailable -Name Microsoft.Graph*) { Get-Module -ListAvailable -Name Microsoft.Graph* | ForEach-Object Path; exit 1 }'
      # Both suites, each recording its test names, then tests/parity.sh on the two lists.
      - run: bash tests/parity-run.sh

  ripgrep-macos:
    name: tests with ripgrep (macOS)
    runs-on: macos-latest
    # It took 54 minutes on GitHub's macOS runner for 1.3.0.
    timeout-minutes: 90
    env:
      GIRD_CHECK_TEST_REQUIRE_RG: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install ripgrep && rg --version
      - run: bash tests/run.sh

  interactive:
    name: game and menu (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/interactive.sh
