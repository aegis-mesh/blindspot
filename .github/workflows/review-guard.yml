name: review-guard

# The one workflow that runs on pull_request_target, so that the guard and this file come from the
# base branch and a pull request cannot change the check that judges it. It never checks out or
# runs the pull request's code: it fetches the pull request's commits as objects and reads their
# diff with the base branch's tools/review-guard.sh. CONTRIBUTING.md "Security review" says what it
# blocks and how a maintainer clears it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: review-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # New commits need a fresh look: the label a maintainer gave the old ones comes off.
  unlabel:
    name: remove security-reviewed
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx security-reviewed; then
            gh api --silent -X DELETE "repos/$REPO/issues/$PR/labels/security-reviewed"
            echo "Removed security-reviewed: the new commits need a fresh review."
          fi

  # No `if:` here: a skipped job would count as a passing required check.
  review-guard:
    name: review-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the pull request's commits, without checking them out
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          git cat-file -e "$HEAD_SHA^{commit}"

      - name: Run the base branch's guard on the diff
        id: guard
        env:
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          bash tools/review-guard.sh "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/findings.txt" 2>&1 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # The findings quote the pull request's own lines: the log must not read them as commands.
          stop=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$stop"
          cat "$RUNNER_TEMP/findings.txt"
          echo "::$stop::"
          {
            echo "## Review guard (exit $rc)"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/findings.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pass, or pass only with security-reviewed from an admin or maintainer
        env:
          RC: ${{ steps.guard.outputs.rc }}
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$RC" in
            0) exit 0 ;;
            1) ;;
            *) echo "The guard could not check this pull request."; exit 1 ;;
          esac
          if [ "$ACTION" = synchronize ]; then
            echo "Findings on new commits. A maintainer reviews them and adds the security-reviewed label."; exit 1
          fi
          if ! gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx security-reviewed; then
            echo "Findings. A maintainer reviews them and adds the security-reviewed label."; exit 1
          fi
          who=$(gh api --paginate "repos/$REPO/issues/$PR/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "security-reviewed") | .actor.login' | tail -n 1)
          case "$who" in
            ''|*[!A-Za-z0-9-]*) echo "Could not tell who added security-reviewed."; exit 1 ;;
          esac
          role=$(gh api "repos/$REPO/collaborators/$who/permission" --jq '.role_name')
          case "$role" in
            admin|maintain) echo "Findings cleared: security-reviewed was added by $who ($role)." ;;
            *) echo "security-reviewed was added by $who, who is not an admin or maintainer ($role)."; exit 1 ;;
          esac
